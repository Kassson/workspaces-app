<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Workspaces — Студенты</title>
    <!-- Путь начинается со слэша, это важно! -->
    <link rel="stylesheet" href="/style.css">
</head>
<body>

    <button class="theme-toggle-btn" id="themeToggle">🌙</button>

    <div class="login-wrapper" id="loginWrapper">
        <div class="auth-container">
            <!-- ВАШ НОВЫЙ ЛОГОТИП -->
            <div class="app-logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
                    <circle cx="256" cy="256" r="256" fill="#007AFF"/>
                    <g transform="translate(64, 64) scale(16)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </g>
                </svg>
            </div>
            <h1 class="app-title">Workspaces</h1>
            <p class="app-subtitle">Единый портал колледжа</p>

            <form id="loginForm">
                <div class="form-group"><input type="text" id="loginInput" class="form-control" placeholder="Логин или Email" required></div>
                <div class="form-group"><input type="password" id="passwordInput" class="form-control" placeholder="Пароль" required></div>
                <button type="submit" class="btn-primary">Войти</button>
            </form>
            <p id="errorMsg" style="color: #FF3B30; font-size: 0.85rem; margin-top: 10px; display: none;"></p>
            <a href="/teach" class="teacher-link-btn">Вход для преподавателей →</a>
        </div>
    </div>

    <!-- ПАНЕЛЬ УПРАВЛЕНИЯ -->
    <div class="app-dashboard" id="dashboard">
        <aside class="sidebar">
            <div class="sidebar-logo">Workspaces 🎓</div>
            <a href="#" class="sidebar-item active">Мой профиль</a>
            <a href="#" class="sidebar-item">Расписание</a>
            <button onclick="logout()" class="btn-primary" style="margin-top: auto;">Выйти</button>
        </aside>
        <main class="main-content">
            <h1 style="font-size: 2rem; margin-bottom: 20px;">Добро пожаловать, <span id="userName">Студент</span>!</h1>
            <p style="color: var(--text-secondary);">Здесь будет отображаться ваше расписание.</p>
        </main>
    </div>

    <script>
        const themeBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';

        themeBtn.addEventListener('click', () => {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        });

        const loginForm = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        if (localStorage.getItem('token') && localStorage.getItem('role') === 'student') {
            document.getElementById('loginWrapper').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
            document.getElementById('userName').textContent = localStorage.getItem('fullName') || 'Студент';
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    login: document.getElementById('loginInput').value,
                    password: document.getElementById('passwordInput').value,
                    isTeacher: false
                })
            });
            const data = await res.json();

            if (res.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('fullName', data.user.fullName);
                localStorage.setItem('role', 'student');
                location.reload();
            } else {
                errorMsg.textContent = data.error;
                errorMsg.style.display = 'block';
            }
        });

        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
