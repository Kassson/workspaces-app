<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspaces</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="theme-toggle-btn" id="themeToggle">🌙</button>

    <div class="login-wrapper" id="loginWrapper">
        <div class="auth-container">
            <!-- Логотип как у преподавателей -->
            <div class="app-logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><circle cx="256" cy="256" r="256" fill="#007AFF"/><path d="M150 256l60 60 150-150" stroke="white" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
            </div>
            
            <div id="viewLogin">
                <h1 class="app-title">Workspaces</h1>
                <p class="app-subtitle">Войдите для доступа к парам</p>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group"><input type="text" id="logInput" class="form-control" placeholder="Логин или Почта" required></div>
                    <div class="form-group"><input type="password" id="logPass" class="form-control" placeholder="Пароль" required></div>
                    <button type="submit" class="btn-primary">Войти</button>
                </form>
                <button class="btn-text" onclick="switchView('viewForgot')">Забыли пароль?</button><br>
                <button class="btn-text" onclick="switchView('viewReg')">Создать аккаунт студента</button>
            </div>

            <div id="viewReg" style="display: none;">
                <h1 class="app-title">Регистрация</h1>
                <form onsubmit="handleReg(event)">
                    <div class="form-group"><input type="text" id="regFirst" class="form-control" placeholder="Имя" required></div>
                    <div class="form-group"><input type="text" id="regLast" class="form-control" placeholder="Фамилия" required></div>
                    <div class="form-group"><input type="text" id="regNick" class="form-control" placeholder="Логин (Ник)" required></div>
                    <div class="form-group">
                        <input type="email" id="regEmail" class="form-control" placeholder="Почта (gmail.com, mail.ru и др.)" required>
                    </div>
                    <div class="form-group"><input type="password" id="regPass" class="form-control" placeholder="Пароль" required></div>
                    <button type="submit" class="btn-primary">Зарегистрироваться</button>
                </form>
                <button class="btn-text" onclick="switchView('viewLogin')">Отмена</button>
            </div>

            <div id="viewForgot" style="display: none;">
                <h1 class="app-title">Сброс пароля</h1>
                <form onsubmit="handleReset(event)">
                    <div class="form-group">
                        <input type="email" id="forgEmail" class="form-control" placeholder="Почта" required>
                    </div>
                    <div class="form-group"><input type="password" id="forgPass" class="form-control" placeholder="Новый пароль" required></div>
                    <button type="submit" class="btn-primary">Сохранить пароль</button>
                </form>
                <button class="btn-text" onclick="switchView('viewLogin')">Отмена</button>
            </div>
            <p id="errorMsg" style="color: var(--danger); font-size: 0.85rem; margin-top: 10px;"></p>
        </div>
        <a href="/teach" class="outside-link">Вы преподаватель? →</a>
    </div>

    <!-- Панель студента -->
    <div class="app-dashboard" id="dashboard">
        <aside class="sidebar">
            <div class="sidebar-logo">Workspaces</div>
            <a onclick="showTab('tab-main')" class="sidebar-item active">Мои группы</a>
            <a onclick="showTab('tab-settings')" class="sidebar-item" style="margin-top: auto;">Настройки</a>
        </aside>
        <main class="main-content">
            <div id="tab-main" class="tab-section active">
                <h1>Добро пожаловать, студент!</h1>
                <div class="settings-card"><p>Здесь будут отображаться ваши пары.</p></div>
            </div>
            <div id="tab-settings" class="tab-section">
                <h1>Настройки</h1>
                <button class="btn-danger" onclick="logout()">Выйти</button>
            </div>
        </main>
    </div>

    <script>
        const themeBtn = document.getElementById('themeToggle');
        const currentTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', currentTheme);
        themeBtn.textContent = currentTheme === 'dark' ? '☀️' : '🌙';
        themeBtn.addEventListener('click', () => {
            const theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('theme', theme);
            themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
        });

        const errorMsg = document.getElementById('errorMsg');
        function switchView(viewId) {
            ['viewLogin', 'viewReg', 'viewForgot'].forEach(id => document.getElementById(id).style.display = 'none');
            document.getElementById(viewId).style.display = 'block'; errorMsg.textContent = '';
        }
        function showTab(tabId) {
            document.querySelectorAll('.tab-section, .sidebar-item').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active'); event.currentTarget.classList.add('active');
        }

        if (localStorage.getItem('token') && localStorage.getItem('role') === 'student') {
            document.getElementById('loginWrapper').style.display = 'none';
            document.getElementById('dashboard').style.display = 'flex';
        }

        function isValidEmailDomain(email) {
            const allowedDomains = ['gmail.com', 'mail.ru', 'yandex.ru', 'rambler.ru', 'bk.ru', 'list.ru', 'inbox.ru', 'ya.ru', 'outlook.com', 'yahoo.com'];
            const domain = email.split('@')[1]?.toLowerCase();
            return allowedDomains.includes(domain);
        }

        async function handleReg(e) {
            e.preventDefault();
            errorMsg.textContent = '';
            
            const email = document.getElementById('regEmail').value.trim();
            if (!isValidEmailDomain(email)) {
                errorMsg.textContent = 'Введите реальный адрес почты (gmail.com, mail.ru, yandex.ru и др.)';
                return;
            }

            const res = await fetch('/api/auth/register', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ 
                    firstName: document.getElementById('regFirst').value, 
                    lastName: document.getElementById('regLast').value, 
                    nickName: document.getElementById('regNick').value, 
                    email: email, 
                    password: document.getElementById('regPass').value 
                })
            });
            const d = await res.json(); 
            if(res.ok) { 
                alert('Регистрация успешно завершена!'); 
                switchView('viewLogin'); 
            } else {
                errorMsg.textContent = d.error;
            }
        }

        async function handleReset(e) {
            e.preventDefault();
            errorMsg.textContent = '';

            const email = document.getElementById('forgEmail').value.trim();
            if (!isValidEmailDomain(email)) {
                errorMsg.textContent = 'Введите реальный адрес почты';
                return;
            }

            const res = await fetch('/api/auth/reset-password', { 
                method: 'POST', 
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, password: document.getElementById('forgPass').value })
            });
            const d = await res.json(); 
            if(res.ok) { 
                alert('Пароль изменен'); 
                switchView('viewLogin'); 
            } else {
                errorMsg.textContent = d.error;
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const res = await fetch('/api/auth/login', { method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ login: document.getElementById('logInput').value, password: document.getElementById('logPass').value, isTeacher: false })
            });
            const data = await res.json();
            if (res.ok) { localStorage.setItem('token', data.token); localStorage.setItem('role', 'student'); location.reload(); } else errorMsg.textContent = data.error;
        }
        function logout() { localStorage.clear(); location.reload(); }
    </script>
</body>
</html>
